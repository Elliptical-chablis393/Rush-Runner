<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushRunner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-light"> <!-- デフォルトテーマを指定 -->

    <div id="theme-switcher">
        <button data-theme="light" class="active">Light</button>
        <button data-theme="dark">Dark</button>
        <button data-theme="led">LED</button>
        <button data-theme="nerv">NERV</button>
    </div>

    <div class="container">
        <header>
            <div class="header-top">
                <h1>RushRunner</h1>
                <button id="settings-toggle" class="icon-btn" title="設定">⚙️</button>
            </div>
            <p class="description">次の電車まで、あとどれくらい？</p>
            <div id="train-info-container" class="train-info"></div>
        </header>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="overlay" style="display: none;">
            <div class="modal">
                <h2>設定</h2>
                <div class="setting-item">
                    <label for="buffer-input">駅構内移動時間 (分):</label>
                    <div class="input-with-unit">
                        <input type="number" id="buffer-input" min="0" max="15" value="0">
                        <span>分</span>
                    </div>
                    <p class="hint">※改札からホームまでの移動時間を考慮します。</p>
                </div>
                <div class="modal-actions">
                    <button id="save-settings" class="primary-btn">保存</button>
                    <button id="close-settings" class="secondary-btn">キャンセル</button>
                </div>
            </div>
        </div>

        <main>
            <div id="search-container">
                <input type="text" id="search-box" placeholder="駅名を入力 (例: 渋谷)">
                <ul id="search-results"></ul>
            </div>

            <div class="station-header">
                <h1 id="station-name">駅を検索...</h1>
                <h2 id="direction"></h2>
                <div id="direction-selector" class="direction-selector">
                    <label for="direction-select">方面:</label>
                    <select id="direction-select"></select>
                </div>
                <div id="line-selector"></div>
            </div>

            <div id="countdown">
                <p class="countdown-label">次の電車</p>
                <div id="next-train-details">
                    <span id="next-train-type">---</span>
                    <span class="separator">|</span>
                    <span id="next-train-destination">---</span>
                </div>
                <div id="timer">--:--</div>
                <p class="timer-suffix">後に発車</p>
            </div>

            <div id="rush-alert">
                <span class="emergency-label"></span>
                <span class="alert-message"></span>
            </div>

            <div class="selectors">
                <button class="active" data-day="weekday">平日</button>
                <button data-day="holiday">土日祝</button>
            </div>

            <div class="timetable-wrapper">
                <div id="timetable-header" class="timetable-header">
                    <h3>時刻表</h3>
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="timetable-container">
                    <table id="timetable">
                        <thead>
                            <tr>
                                <th>種別</th>
                                <th>行先</th>
                                <th>発車時刻</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 時刻表データはここに挿入されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="debug-controls">
        <h4>試験用ボタン</h4>
        <button id="debug-safe">余裕</button>
        <button id="debug-warning">走れば</button>
        <button id="debug-danger">無理</button>
    </div>

    <script src="app.v3.js"></script>
</body>

</html>
